services:
  db:
    image: pgvector/pgvector:pg16
    container_name: crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      # 5433 en el host para no chocar con un PostgreSQL nativo en 5432.
      - "5433:5432"
    volumes:
      - crm-db-data:/var/lib/postgresql/data
      # Habilita pgvector al crear la base por primera vez.
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - crm-redis-data:/data

volumes:
  crm-db-data:
  crm-redis-data:
