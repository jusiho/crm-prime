# ============================================================
#  CRM Prime — Nginx (reverse proxy + TLS)
#  Coloca este archivo en: /etc/nginx/sites-available/crm-prime.conf
#  y enlázalo:  ln -s ../sites-available/crm-prime.conf /etc/nginx/sites-enabled/
#  Sustituye tu-dominio.com por tu dominio real.
# ============================================================

# Cabeceras de upgrade para WebSocket (socket.io).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → redirige a HTTPS (excepto el challenge de Let's Encrypt) ──
server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tu-dominio.com www.tu-dominio.com;

    # Certificados (los genera certbot — ver instrucciones abajo).
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Permite subir medios (imágenes/documentos) sin error 413.
    client_max_body_size 25m;

    # Cabeceras comunes que pasan a los upstreams.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1) Realtime (WebSocket) → API. DEBE ir antes que las demás.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # conexiones largas
    }

    # 2) API REST + webhook de Meta → API (NestJS, prefijo /api/v1).
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # 3) Todo lo demás (web + su BFF /api/bff) → Next.js.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # HMR/streaming de Next
        proxy_set_header Connection $connection_upgrade;
    }
}
