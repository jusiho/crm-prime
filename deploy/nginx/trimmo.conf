# ============================================================
#  Trimmo — Nginx (reverse proxy + TLS) en modo multi-empresa
#
#  Si usas Nginx Proxy Manager NO necesitas este fichero: ahí se configura
#  por interfaz. Esto es para quien prefiere nginx a pelo.
#
#  Coloca en: /etc/nginx/sites-available/trimmo.conf
#  y enlaza:  ln -s ../sites-available/trimmo.conf /etc/nginx/sites-enabled/
#  Sustituye trimmo.lat por tu dominio.
# ============================================================
#
#  ── El reparto ──────────────────────────────────────────────
#    trimmo.lat            → alta de empresas y marketing
#    *.trimmo.lat          → el panel de cada empresa
#    api.trimmo.lat        → la API (webhook de Meta y WebSocket)
#
#  La API va en su propio subdominio y no bajo /api del comodín por un motivo
#  concreto: Meta necesita UNA url de webhook fija. Si colgara de cada
#  subdominio de empresa, habría que elegir una y quedaría arbitraria.
#
#  ── El certificado ──────────────────────────────────────────
#  Uno solo, comodín, para *.trimmo.lat y trimmo.lat. Hay que emitirlo por
#  reto DNS-01: HTTP-01 no puede firmar comodines.
#
#    certbot certonly --dns-cloudflare \
#      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#      -d 'trimmo.lat' -d '*.trimmo.lat'
#
#  Con esto, dar de alta una empresa no toca ni DNS ni certificados ni nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name trimmo.lat *.trimmo.lat;
    return 301 https://$host$request_uri;
}

# ── La API ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.trimmo.lat;

    ssl_certificate     /etc/letsencrypt/live/trimmo.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trimmo.lat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Medios de WhatsApp: sin esto, subir una imagen da 413.
    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket de la bandeja en vivo. Va primero: si cayera en el location
    # genérico, la conexión se cerraría a los 60 segundos.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
    }
}

# ── El panel: dominio base y todas las empresas ─────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # El orden importa: nginx prefiere el nombre exacto al comodín, así que
    # api.trimmo.lat siempre gana contra *.trimmo.lat de arriba.
    server_name trimmo.lat www.trimmo.lat *.trimmo.lat;

    ssl_certificate     /etc/letsencrypt/live/trimmo.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trimmo.lat/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # El Host tiene que llegar intacto: de él saca Next el subdominio y, con
    # él, qué empresa es. Si se reescribe, todos los clientes ven la pantalla
    # de acceso del dominio base.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
}
